[BrethrenPatch]

; Brethren Patch - settings
;
; 1 = on, 0 = off. Anything you leave out uses the default shown here, so a
; shorter file is fine. The game reads this once at startup.
;
; Three sections:
;   ON BY DEFAULT - fixes and small improvements, live as soon as you install
;   OPTIONS       - they work, but they change how the game plays, so you choose
;   EXPERIMENTAL  - unfinished or broken. Off. Turn on at your own risk.


; ===================================================================
;  ON BY DEFAULT
; ===================================================================

; With VSync on, the game locks to 30 FPS no matter what your monitor does.
; This unlocks it. Set VSyncMultiplier=2 for the old behaviour, 0 for uncapped.
VSyncRefreshRateFix=1
VSyncMultiplier=1

; Subtitles are a fixed pixel size, so they shrink as resolution goes up.
; This keeps them readable. UiScalePercent makes them bigger or smaller.
UiScaling=1
UiScalePercent=100

; Fixes a crash when a checkpoint reloads. Leave this on.
CheckpointGuard=1

; Writes BrethrenPatch.log next to the game. Enable this before reporting a
; bug, then include the log with the report.
DebugLogging=0

; Skips the publisher logos at startup and drops you at the menu.
; StartupLogoPercent is how much of the 9 second sequence to keep:
; 0 removes it, 50 halves it, 100 leaves it alone.
SkipStartupLogos=1
StartupLogoPercent=0

; Skips the attract video, the trailer that plays if you idle in the menu.
; Chapter cutscenes and the "previously" recap are not affected.
SkipAttractVideo=1

; Adds the Classic coop campaign entry and gives it a normal two player lobby.
; Both players need it on and both need a Classic save. ClassicModeUnlock opens
; the New Game+ mode list for an account without an endgame save.
ClassicCoop=1
ClassicModeUnlock=1
; Stops DS3 from moving its own slider in the Windows volume mixer. The game
; uses the old waveOutSetVolume call, which on modern Windows moves the per
; application volume rather than the device volume, so it silently overrides
; whatever you had set. It asks for 90% three times during startup.
; VolumeDiagnostics logs the calls without blocking them.
KeepWindowsVolume=1
VolumeDiagnostics=0

; ===================================================================
;  OPTIONS
;
;  These work too. They are off because they change how the game plays,
;  and that should be your call.
; ===================================================================

; Only if the game is unstable on a CPU with a lot of cores.
HighCoreCPUFix=0
CpuCoreCap=8

; Uses SDL3 for controller input and presents the selected gamepad through the
; XInput path DS3 already uses. This supports PlayStation, Nintendo and other
; controllers handled by SDL.
UseSDLControllerInput=0

; Hides duplicate DirectInput gamepads while SDL controller input is active.
; Mouse and keyboard devices are never filtered.
FilterInputDevices=0

; Writes controller connection and gyro capability changes to the log.
SDLControllerDiagnostics=0

; Adds controller gyro movement to the right stick camera path. GyroAimOnly
; limits it to aiming with the left trigger.
GyroAiming=0
GyroAimOnly=1
GyroSensitivity=1.0
GyroSmoothing=0.15


; -------------------------------------------------------------------
;  More enemies
;
;  When a level tells a spawn point to release an enemy, the patch asks
;  the game for that same enemy again through its own retry path. Nothing
;  is built by hand, so the extras behave exactly like the originals and
;  survive checkpoints.
;
;  Props, doors, triggers and boss objects come out of the same code and
;  are left alone on purpose. The patch carries a table built from the
;  game's own level files: 1366 spawn points, 557 of them confirmed
;  enemies, the rest blocked.
;
;  More enemies means more ammo, and drops do not scale with them.
;  200 is a real difficulty change. 400 and up is a shooting gallery.
; -------------------------------------------------------------------

MoreEnemies=0

; How many enemies you get, in percent. 100 is unchanged, 200 is twice as
; many. Fractions are kept exact: at 150 every second spawn gets one extra.
MoreEnemiesPercent=200

; Solo uses MoreEnemiesPercent above. In coop the count follows the roster
; instead: up to BasePlayers nothing changes, every player above that adds
; PerPlayerPercent. So 2 players unchanged, 3 players 150%, 4 players 200%.
MoreEnemiesBasePlayers=2
MoreEnemiesPerPlayerPercent=50

; A spawn point limits how many enemies it may release in total and how many
; may live at once. Both have to come up or the extras get refused.
MoreEnemiesRaiseSpawnerCap=1
MoreEnemiesRaisePopulationLimit=1

; The patch ships with 14 enemy families it recognises by code address. That
; is what lets it handle spawn points the level table cannot resolve.
MoreEnemiesKnownFamilies=1

; Only multiply spawn points whose identity is certain. Turning this off will
; duplicate scripted objects.
MoreEnemiesExactSpawnerMatch=1

; Research mode: every enemy you shoot is written to BrethrenPatch_Enemies.txt
; so its spawn point becomes eligible next time. Only helps on your machine.
MoreEnemiesLearnFromKills=0

; Per enemy type. The value is a percentage of the EXTRA enemies, not of the
; ones the level already places:
;     0 = never add this type
;   100 = follow MoreEnemiesPercent
;   200 = this type gets twice the extra everything else gets
;
; At MoreEnemiesPercent=200 the extra is +100, so a type set to 50 ends up at
; 150% while the rest sits at 200. The number at the end is how many spawn
; points use that type, which tells you how much a change will be felt.
EnemyType_slasher_berserk             =100   ; Slasher, enraged                        79 spawn points
EnemyType_fodder                      =100   ; Fodder, the small crawlers              70 spawn points
EnemyType_feeder                      =33    ; Feeder                                  39 spawn points
EnemyType_human_rifle                 =100   ; Unitologist soldier, rifle              34 spawn points
EnemyType_hunter                      =100   ; Hunter, regenerates                     32 spawn points
EnemyType_lurker                      =100   ; Lurker, the ceiling spitter             27 spawn points
EnemyType_slasher_frozen              =100   ; Slasher, frozen (Tau Volantis)          26 spawn points
EnemyType_super_feeder                =33   ; Feeder, tougher                         25 spawn points
EnemyType_leaper                      =100   ; Leaper                                  23 spawn points
EnemyType_super_slasher               =100   ; Slasher, tougher                        20 spawn points
EnemyType_exploder                    =100   ; Exploder, the arm blister               15 spawn points
EnemyType_stalker                     =100   ; Stalker, hunts in packs                 14 spawn points
EnemyType_puker                       =100   ; Puker                                   13 spawn points
EnemyType_swarm_infector              =100   ; Swarm / Infector                        12 spawn points
EnemyType_ExitPlayDead_zombie         =0     ; Corpse that plays dead, then gets up    11 spawn points
EnemyType_twitcher                    =100   ; Twitcher, the fast one                   9 spawn points
EnemyType_alien_crawler               =100   ; Alien crawler (Tau Volantis)             8 spawn points
EnemyType_pack_boy                    =33    ; Pack member, the small feral ones        8 spawn points
EnemyType_divider_head                =100   ; Divider head                             6 spawn points
EnemyType_super_stalker               =100   ; Stalker, tougher                         6 spawn points
EnemyType_alien_necromorph            =100   ; Alien necromorph (Tau Volantis)          5 spawn points
EnemyType_lurker_big                  =100   ; Lurker, large                            5 spawn points
EnemyType_fodder_armless              =100   ; Fodder, armless                          4 spawn points
EnemyType_spitter                     =100   ; Spitter                                  4 spawn points
EnemyType_human_shotgun               =100   ; Unitologist soldier, shotgun             3 spawn points
EnemyType_pregnant                    =100   ; Pregnant, bursts into swarmers           3 spawn points
EnemyType_super_leaper                =100   ; Leaper, tougher                          3 spawn points
EnemyType_super_lurker                =100   ; Lurker, tougher                          3 spawn points
EnemyType_guardian                    =100   ; Guardian, the wall growth                2 spawn points
EnemyType_human_bazooka               =100   ; Unitologist soldier, bazooka/grenade     2 spawn points
EnemyType_slasher_bigger              =100   ; Slasher, large                           2 spawn points
EnemyType_super_puker                 =100   ; Puker, tougher                           2 spawn points
EnemyType_divider_soldier_shotgun     =100   ; Divider soldier, shotgun                 1 spawn point
EnemyType_slasher                     =100   ; Slasher                                  1 spawn point
EnemyType_slasher_aggro               =100   ; Slasher, aggressive                      1 spawn point

; Quarantine fights are run by the AI Director instead of fixed spawn points,
; and scaling those is unfinished. The three switches for it sit in the
; EXPERIMENTAL section at the end of this file.

; Damage scaling. The two percentages below only do anything with
; DifficultyScaling=1.
;
; Do not put EnemyDamageTakenPercent below 100. Dismemberment needs a single
; hit above a fixed threshold. It is not a health percentage. Below 100 your
; shots fall under it, limbs stop coming off, and a Guardian becomes
; unkillable because its tentacles are its only weak points. The patch refuses
; values under 100 for that reason. To make the game harder, raise
; PlayerDamageTakenPercent instead.
DifficultyScaling=0
EnemyDamageTakenPercent=100
PlayerDamageTakenPercent=100

; ===================================================================
;  EXPERIMENTAL / UNFINISHED
;
;  None of this is finished. It is off and it should stay off unless you
;  are testing. Where something is known not to work, the comment says so.
; ===================================================================

; Uses Windows raw mouse deltas while aiming a weapon on foot. Hip camera
; movement, Zero-G and scripted aiming cameras still use the original input.
RawMouseInput=0
RawMouseSensitivity=1.0

; Records raw mouse samples and their game call stacks.
RawMouseInputDiagnostics=0

; The AI Director runs the quarantine fights: it picks an encounter and feeds
; enemies in until the room is done. Everywhere else the level places enemies
; from fixed spawn points, and those are what MoreEnemies scales. That part
; works and covers most of the campaign.
;
; None of the three switches below delivers what it promises. Every number
; they raise was measured and none of them is what limits a quarantine: the
; Director sat at four enemies while it was allowed 32, with its difficulty
; budget at 10 of 10 free, half a minute of encounter time left and a spawn
; allowed every second. What runs out is somewhere for the enemies to appear.
; The Director only uses vents that are off camera, in range and unoccupied,
; and no setting here changes that. Turning these on costs performance and
; changes which enemy types show up, without giving you more of them.
MoreEnemiesDirectorScaling=0

; Also raises how many enemies an encounter must produce before it counts as
; finished. If the Director cannot deliver them the quarantine door never
; unlocks, so leave this off unless you are testing.
MoreEnemiesDirectorQuota=0

; Spawns the extra enemies at once instead of queueing them. The game only
; ever keeps one queued request per spawn point, so without this the extras
; trickle in one at a time as you kill the previous one. With it they appear
; together, spread over a small ring around the authored spot. Experimental:
; it bypasses the game's own pacing.
MoreEnemiesAtOnce=0

; Havok's solver is tuned for 30 FPS, so above that corpses and severed limbs
; get flung around. This scales the solver inputs back.
;
; It helps, but not reliably. Roughly half the time ragdolls still misbehave.
; The eight Hook switches let you turn the individual pieces off to find which
; one is responsible. That is far more useful in a bug report than "physics is
; broken".
HavokPhysicsFix=0
HookContactJacobian=1
HookBallSocket=1
HookAngular1D=1
HookSolverInit=1
HookImpulseDamper=1
HookErrorScaler=1
HookMassCapture=1
HookDeadState=1
RagdollMessageId=31
RagdollSubsteps=0

; Depth of field gets weaker the higher your resolution goes.
;
; This does not work, and not by a small margin. It scales minRadius and
; maxRadius, which belong to the lens blur path, but the PC build uses the
; gaussian path, where those two are always zero. Measured in game with blur
; clearly on screen. The switch stays so the next attempt has a starting point.
DepthOfFieldFix=0
DepthOfFieldPercent=100

; Same effect from the shader side. Also unfinished.
DepthOfFieldShaderFix=0
DepthOfFieldShaderDiagnostics=0

; Extra logging for the physics solver and for kinesis. Noisy, developer only.
TKDiagnostics=0
SolverDiagnostics=0

; Records which spawner an enemy you shot came from. Research only.
MoreEnemiesDamageMemoryProbe=0

; Randomises which enemy comes out of each spawn point. Work in progress.
EnemyRandomizer=0
EnemyRandomizerPercent=100
EnemyRandomizerAllowHumans=0
EnemyRandomizerGlobalTemplates=0
EnemyRandomizerCrossFamilyGround=0
EnemyRandomizerDiagnostics=0
EnemyRandomizerLogLimit=160
