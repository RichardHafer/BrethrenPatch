[BrethrenPatch]

; Stabilises physics above 30 FPS. Without it, corpses and severed limbs are
; thrown across the room.
HavokPhysicsFix=1

; Removes the 30 FPS lock that the game applies when VSync is enabled.
;   0 = uncapped, 1 = full refresh rate, 2 = original half rate
VSyncRefreshRateFix=1
VSyncMultiplier=1

; Scales subtitles with the resolution instead of keeping a fixed pixel size.
; UiScalePercent tunes the result; 100 matches the console reference.
UiScaling=1
UiScalePercent=100

; Caps the process to CpuCoreCap logical processors. Off by default - see the
; comment in src/HighCoreCpu.cpp for why.
HighCoreCPUFix=0
CpuCoreCap=8

; Writes BrethrenPatch.log next to the executable.
DebugLogging=1

; Message id that marks the transition into the dead state. Only change this if
; corpse damping stops working after a game update.
RagdollMessageId=31

; Individual Havok hooks, for narrowing down a crash.
HookContactJacobian=1
HookBallSocket=1
HookAngular1D=1
HookSolverInit=1
HookImpulseDamper=1
HookErrorScaler=1
HookMassCapture=1
HookDeadState=1
